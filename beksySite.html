<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Wayanad Farm Fresh — Pure Spices & Coffee Farmed in Wayanad</title>
  <meta name="description" content="Pure Spices & Coffee Farmed in Wayanad. Order farm-fresh pepper, coffee, ginger, turmeric, and kudampuli directly via WhatsApp." />
  <meta name="theme-color" content="#1b5e20" />
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <style>
    :root {
      --primary: #1b5e20;
      --primary-dark: #124116;
      --primary-light: #e8f5e9;
      --accent: #d35400;
      --accent-dark: #b34700;
      --accent-light: #fff3e0;
      --bg: #f5f7f5;
      --surface: #ffffff;
      --text: #1c241d;
      --text-muted: #5c6b5e;
      --border: #dfe6e0;
      --danger: #c62828;
      --shadow-sm: 0 2px 8px rgba(27, 94, 32, 0.06);
      --shadow-md: 0 6px 20px rgba(27, 94, 32, 0.12);
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --sidebar-width: 270px;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      max-width: 100%;
      overflow-x: hidden;
      overflow-y: auto;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.45;
    }

    /* Animated SVG Logo */
    .logo-svg {
      width: 46px;
      height: 46px;
      flex-shrink: 0;
      display: block;
    }

    .logo-leaf-left {
      transform-origin: 23px 28px;
      animation: leafSwayLeft 3.4s ease-in-out infinite;
    }

    .logo-leaf-right {
      transform-origin: 23px 28px;
      animation: leafSwayRight 3.4s ease-in-out infinite;
    }

    .logo-bean {
      transform-origin: 23px 26px;
      animation: beanPulse 3.4s ease-in-out infinite;
    }

    @keyframes leafSwayLeft {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-6deg); }
    }

    @keyframes leafSwayRight {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(6deg); }
    }

    @keyframes beanPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.06); }
    }

    /* App Layout */
    .app-shell {
      display: flex;
      min-height: 100vh;
      width: 100%;
      max-width: 100%;
    }

    /* Desktop Sidebar */
    .sidebar {
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
      width: var(--sidebar-width);
      background: var(--primary);
      color: #ffffff;
      display: flex;
      flex-direction: column;
      padding: 24px 18px;
      z-index: 40;
      box-shadow: 2px 0 16px rgba(0, 0, 0, 0.08);
    }

    .brand-block {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
    }

    .brand-info h1 {
      margin: 0;
      font-size: 1.12rem;
      font-weight: 800;
      letter-spacing: -0.01em;
      line-height: 1.2;
      color: #ffffff;
    }

    .brand-info p {
      margin: 3px 0 0;
      font-size: 0.74rem;
      color: rgba(255, 255, 255, 0.85);
      line-height: 1.25;
    }

    .sidebar-nav {
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex: 1;
    }

    .nav-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      width: 100%;
      padding: 12px 14px;
      border: none;
      border-radius: var(--radius-sm);
      background: transparent;
      color: rgba(255, 255, 255, 0.86);
      font-size: 0.94rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease, color 0.2s ease;
      text-align: left;
    }

    .nav-btn:hover {
      background: rgba(255, 255, 255, 0.12);
      color: #ffffff;
    }

    .nav-btn.active {
      background: #ffffff;
      color: var(--primary);
      box-shadow: var(--shadow-sm);
    }

    .nav-btn-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .nav-badge {
      background: var(--accent);
      color: #ffffff;
      font-size: 0.72rem;
      font-weight: 700;
      min-width: 22px;
      height: 22px;
      padding: 0 6px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .nav-badge.hidden {
      display: none;
    }

    .sidebar-footer {
      border-top: 1px solid rgba(255, 255, 255, 0.18);
      padding-top: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .share-desktop-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      border: 1px solid rgba(255, 255, 255, 0.3);
      background: rgba(255, 255, 255, 0.1);
      color: #ffffff;
      font-size: 0.86rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .share-desktop-btn:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    /* Mobile Header & Tabs */
    .mobile-header {
      display: none;
    }

    .mobile-tabs {
      display: none;
    }

    /* Main Content */
    .main-content {
      margin-left: var(--sidebar-width);
      flex: 1;
      min-width: 0;
      padding: 20px 24px 96px;
      width: calc(100% - var(--sidebar-width));
    }

    .container {
      max-width: 1080px;
      margin: 0 auto;
      width: 100%;
    }

    /* Announcement Banner */
    .announcement-banner {
      display: none;
      align-items: center;
      gap: 10px;
      background: linear-gradient(135deg, #1b5e20 0%, #2e7d32 100%);
      color: #ffffff;
      padding: 11px 16px;
      border-radius: var(--radius-md);
      margin-bottom: 16px;
      box-shadow: var(--shadow-sm);
      font-size: 0.88rem;
      font-weight: 600;
      min-height: 44px;
      border-left: 4px solid var(--accent);
    }

    .announcement-banner.visible {
      display: flex;
    }

    .announcement-icon {
      flex-shrink: 0;
      font-size: 1rem;
    }

    .announcement-text-wrap {
      flex: 1;
      min-width: 0;
      word-break: break-word;
    }

    .typewriter-cursor {
      display: inline-block;
      width: 2px;
      height: 1em;
      background: #ffd54f;
      margin-left: 2px;
      vertical-align: -2px;
      animation: blinkCursor 0.75s step-end infinite;
    }

    @keyframes blinkCursor {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    /* Search Bar */
    .search-bar-wrap {
      position: relative;
      margin-bottom: 16px;
    }

    .search-input {
      width: 100%;
      padding: 12px 42px 12px 42px;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-md);
      background: var(--surface);
      font-size: 0.95rem;
      color: var(--text);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      box-shadow: var(--shadow-sm);
    }

    .search-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(27, 94, 32, 0.12);
    }

    .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      pointer-events: none;
      display: flex;
    }

    .search-clear {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      border: none;
      background: #edf2ee;
      color: var(--text-muted);
      width: 26px;
      height: 26px;
      border-radius: 50%;
      font-size: 0.9rem;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
    }

    .search-clear.visible {
      display: flex;
    }

    /* Section Views */
    .view-section {
      display: none;
    }

    .view-section.active {
      display: block;
    }

    /* Product Grid */
    .products-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 16px;
      width: 100%;
    }

    .product-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: var(--shadow-sm);
      cursor: pointer;
      transition: transform 0.16s ease, box-shadow 0.16s ease;
      position: relative;
      min-width: 0;
    }

    .product-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }

    .product-card.out-of-stock {
      opacity: 0.85;
    }

    .product-img-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      background: #eef3ee;
      overflow: hidden;
    }

    .product-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.3s ease;
    }

    .product-card.out-of-stock .product-img {
      filter: grayscale(100%) brightness(0.75);
    }

    .oos-badge {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.38);
      pointer-events: none;
    }

    .oos-badge span {
      background: var(--danger);
      color: #ffffff;
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.06em;
      padding: 5px 10px;
      border-radius: 6px;
      text-transform: uppercase;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
    }

    /* Zepto-Style Floating + / - qty + Control on Image */
    .card-action-float {
      position: absolute;
      right: 8px;
      bottom: 8px;
      z-index: 5;
    }

    .btn-plus {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      border: 1.5px solid var(--primary);
      background: #ffffff;
      color: var(--primary);
      font-size: 1.35rem;
      font-weight: 700;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.16);
      transition: background 0.15s, color 0.15s, transform 0.12s;
    }

    .btn-plus:active {
      transform: scale(0.92);
    }

    .btn-plus:hover {
      background: var(--primary);
      color: #ffffff;
    }

    .qty-pill {
      display: inline-flex;
      align-items: center;
      background: var(--primary);
      color: #ffffff;
      border-radius: 10px;
      height: 34px;
      overflow: hidden;
      box-shadow: 0 3px 10px rgba(27, 94, 32, 0.3);
    }

    .qty-pill button {
      width: 28px;
      height: 34px;
      border: none;
      background: transparent;
      color: #ffffff;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .qty-pill button:active {
      background: rgba(255, 255, 255, 0.2);
    }

    .qty-pill span {
      min-width: 22px;
      text-align: center;
      font-size: 0.85rem;
      font-weight: 700;
    }

    .product-body {
      padding: 10px 10px 12px;
      display: flex;
      flex-direction: column;
      flex: 1;
      gap: 6px;
      min-width: 0;
    }

    .product-title {
      margin: 0;
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .product-desc {
      margin: 0;
      font-size: 0.76rem;
      color: var(--text-muted);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      line-height: 1.35;
      min-height: 2.7em;
    }

    .product-controls {
      margin-top: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .size-select {
      width: 100%;
      padding: 6px 8px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: #f9fbf9;
      color: var(--text);
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      outline: none;
    }

    .size-select:focus {
      border-color: var(--primary);
    }

    .size-select:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .price-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
    }

    .product-price {
      font-size: 1rem;
      font-weight: 800;
      color: var(--primary);
    }

    .unit-tag {
      font-size: 0.72rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    /* Cart View */
    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      gap: 12px;
    }

    .section-header h2 {
      margin: 0;
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--primary-dark);
    }

    .btn-text-danger {
      background: transparent;
      border: none;
      color: var(--danger);
      font-size: 0.84rem;
      font-weight: 600;
      cursor: pointer;
      padding: 6px 10px;
      border-radius: var(--radius-sm);
    }

    .btn-text-danger:hover {
      background: #ffebee;
    }

    .cart-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 20px;
    }

    .cart-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 12px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: var(--shadow-sm);
    }

    .cart-item-img {
      width: 60px;
      height: 60px;
      border-radius: var(--radius-sm);
      object-fit: cover;
      background: #eef3ee;
      flex-shrink: 0;
    }

    .cart-item-info {
      flex: 1;
      min-width: 0;
    }

    .cart-item-title {
      margin: 0;
      font-size: 0.92rem;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .cart-item-meta {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .cart-item-price {
      font-size: 0.92rem;
      font-weight: 800;
      color: var(--primary);
      margin-top: 4px;
    }

    .cart-summary-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 18px;
      box-shadow: var(--shadow-sm);
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      font-size: 0.95rem;
    }

    .summary-row.total {
      border-top: 1px dashed var(--border);
      padding-top: 12px;
      margin-top: 8px;
      margin-bottom: 16px;
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--primary-dark);
    }

    .btn-primary-full {
      width: 100%;
      padding: 14px 18px;
      border: none;
      border-radius: var(--radius-md);
      background: var(--accent);
      color: #ffffff;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 14px rgba(211, 84, 0, 0.28);
      transition: background 0.2s, transform 0.12s;
    }

    .btn-primary-full:hover {
      background: var(--accent-dark);
    }

    .btn-primary-full:active {
      transform: scale(0.98);
    }

    .btn-primary-full:disabled {
      background: #b0bec5;
      box-shadow: none;
      cursor: not-allowed;
    }

    .btn-green-full {
      background: var(--primary);
      box-shadow: 0 4px 14px rgba(27, 94, 32, 0.25);
    }

    .btn-green-full:hover {
      background: var(--primary-dark);
    }

    /* Empty State */
    .empty-state {
      text-align: center;
      padding: 48px 20px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      color: var(--text-muted);
    }

    .empty-state-icon {
      font-size: 2.5rem;
      margin-bottom: 10px;
      display: block;
    }

    .empty-state h3 {
      margin: 0 0 6px;
      color: var(--text);
      font-size: 1.05rem;
    }

    .empty-state p {
      margin: 0 0 18px;
      font-size: 0.88rem;
    }

    .btn-outline {
      padding: 10px 18px;
      border-radius: var(--radius-sm);
      border: 1.5px solid var(--primary);
      background: transparent;
      color: var(--primary);
      font-weight: 700;
      font-size: 0.88rem;
      cursor: pointer;
    }

    /* My Orders Tab */
    .orders-lookup-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: var(--shadow-sm);
    }

    .orders-lookup-form {
      display: flex;
      gap: 10px;
      margin-top: 8px;
    }

    .input-field {
      width: 100%;
      padding: 11px 14px;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 0.95rem;
      font-family: inherit;
      color: var(--text);
      background: #ffffff;
      outline: none;
    }

    .input-field:focus {
      border-color: var(--primary);
    }

    .btn-lookup {
      padding: 0 18px;
      border: none;
      border-radius: var(--radius-sm);
      background: var(--primary);
      color: #ffffff;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      white-space: nowrap;
    }

    .orders-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .order-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 4px solid var(--primary);
      border-radius: var(--radius-md);
      padding: 14px 16px;
      box-shadow: var(--shadow-sm);
    }

    .order-card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
      padding-bottom: 8px;
      border-bottom: 1px solid #eef2ef;
    }

    .order-date {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text-muted);
    }

    .order-status-pill {
      font-size: 0.72rem;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 999px;
      background: var(--primary-light);
      color: var(--primary);
    }

    .order-body-pre {
      margin: 0;
      white-space: pre-wrap;
      word-break: break-word;
      font-family: inherit;
      font-size: 0.86rem;
      color: var(--text);
      line-height: 1.5;
    }

    /* Floating Cart Button */
    .floating-cart-btn {
      position: fixed;
      right: 18px;
      bottom: 20px;
      width: 58px;
      height: 58px;
      border-radius: 50%;
      border: none;
      background: var(--accent);
      color: #ffffff;
      box-shadow: 0 6px 20px rgba(211, 84, 0, 0.42);
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 50;
      transition: transform 0.15s ease;
    }

    .floating-cart-btn.visible {
      display: flex;
    }

    .floating-cart-btn:active {
      transform: scale(0.92);
    }

    .floating-cart-badge {
      position: absolute;
      top: -4px;
      right: -4px;
      background: var(--primary);
      color: #ffffff;
      border: 2px solid #ffffff;
      font-size: 0.74rem;
      font-weight: 800;
      min-width: 24px;
      height: 24px;
      padding: 0 5px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Modals (Bottom-Sheet on Mobile, Centered on Desktop) */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(12, 24, 14, 0.56);
      backdrop-filter: blur(2px);
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-sheet {
      background: var(--surface);
      width: 100%;
      max-width: 480px;
      max-height: 90vh;
      overflow-y: auto;
      border-radius: var(--radius-lg);
      box-shadow: 0 18px 48px rgba(0, 0, 0, 0.28);
      position: relative;
      animation: modalFadeIn 0.2s ease-out;
    }

    @keyframes modalFadeIn {
      from { opacity: 0; transform: translateY(16px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .modal-close-btn {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: none;
      background: rgba(255, 255, 255, 0.92);
      color: var(--text);
      font-size: 1.2rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.16);
      z-index: 10;
    }

    .modal-product-img {
      width: 100%;
      aspect-ratio: 16 / 11;

        }
      }

      function saveJSON(key, value) {
        try {
          localStorage.setItem(key, JSON.stringify(value));
        } catch { /* ignore storage quota errors */ }
      }

      function showToast(message, type = "default") {
        const el = document.getElementById("toast");
        el.textContent = message;
        el.className = "toast show" + (type !== "default" ? " " + type : "");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => {
          el.classList.remove("show");
        }, 2800);
      }

      function escapeHtml(str) {
        return String(str ?? "")
          .replace(/&/g, "&")
          .replace(/</g, "<")
          .replace(/>/g, ">")
          .replace(/"/g, """)
          .replace(/'/g, "'");
      }

      function makeFallbackImage(name) {
        const lower = (name || "").toLowerCase();
        let bg1 = "#2e7d32", bg2 = "#1b5e20", emoji = "🌿";
        if (lower.includes("coffee")) { bg1 = "#5d4037"; bg2 = "#3e2723"; emoji = "☕"; }
        else if (lower.includes("black pepper")) { bg1 = "#37474f"; bg2 = "#1c241d"; emoji = "⚫"; }
        else if (lower.includes("green pepper")) { bg1 = "#2e7d32"; bg2 = "#1b5e20"; emoji = "🟢"; }
        else if (lower.includes("turmeric") || lower.includes("manjal")) { bg1 = "#f57f17"; bg2 = "#d35400"; emoji = "✨"; }
        else if (lower.includes("ginger") || lower.includes("chukku") || lower.includes("inchi")) { bg1 = "#a1887f"; bg2 = "#6d4c41"; emoji = "🫚"; }
        else if (lower.includes("kudampuli") || lower.includes("tamarind")) { bg1 = "#4e342e"; bg2 = "#261612"; emoji = "🍂"; }

        const shortLabel = (name || "Farm Fresh").slice(0, 22).replace(/&/g, "and");
        const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
          <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="${bg1}"/><stop offset="100%" stop-color="${bg2}"/></linearGradient></defs>
          <rect width="400" height="400" fill="url(#g)"/>
          <circle cx="200" cy="170" r="68" fill="rgba(255,255,255,0.14)"/>
          <text x="200" y="192" font-size="64" text-anchor="middle">${emoji}</text>
          <text x="200" y="285" font-family="sans-serif" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">${shortLabel}</text>
          <text x="200" y="316" font-family="sans-serif" font-size="14" fill="rgba(255,255,255,0.78)" text-anchor="middle">Wayanad Farm Fresh</text>
        </svg>`;
        return "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(svg);
      }

      function normalizeRow(rawRow) {
        const cleaned = {};
        Object.keys(rawRow || {}).forEach((k) => {
          const cleanKey = String(k).trim().toLowerCase();
          cleaned[cleanKey] = typeof rawRow[k] === "string" ? rawRow[k].trim() : rawRow[k];
        });
        return cleaned;
      }

      function parsePrice(val) {
        if (val === undefined || val === null || val === "") return null;
        const num = parseFloat(String(val).replace(/[^\d.]/g, ""));
        return Number.isFinite(num) && num > 0 ? num : null;
      }

      function isOutOfStock(stockVal) {
        const s = String(stockVal ?? "").trim().toLowerCase();
        return s === "out" || s === "out of stock" || s === "no" || s === "0";
      }

      function buildProductObjects(rows) {
        const announcements = [];
        const list = [];

        rows.forEach((raw, idx) => {
          const row = normalizeRow(raw);
          const name = String(row.name || "").trim();
          if (!name) return;

          if (name.toUpperCase() === "ANNOUNCEMENT") {
            const desc = String(row.description || "").trim();
            if (desc) {
              desc.split("|").map((s) => s.trim()).filter(Boolean).forEach((msg) => announcements.push(msg));
            }
            return;
          }

          const tiers = [];
          WEIGHT_TIERS.forEach((t) => {
            const price = parsePrice(row[t.key]);
            if (price !== null) {
              tiers.push({ key: t.key, label: t.label, price });
            }
          });

          if (tiers.length === 0) return;

          const id = "prod_" + idx + "_" + name.toLowerCase().replace(/[^a-z0-9]+/g, "_");
          const imgUrl = row.image && /^https?:\/\//i.test(row.image) ? row.image : makeFallbackImage(name);

          list.push({
            id,
            name,
            description: String(row.description || ""),
            image: imgUrl,
            fallbackImage: makeFallbackImage(name),
            tiers,
            outOfStock: isOutOfStock(row.stock)
          });

          if (!selectedWeights[id] || !tiers.some((t) => t.key === selectedWeights[id])) {
            selectedWeights[id] = tiers[0].key;
          }
        });

        return { list, announcements };
      }

      // ==========================================
      // 4. ANNOUNCEMENT TYPEWRITER (Intl.Segmenter)
      // ==========================================
      function segmentGraphemes(text) {
        if (typeof Intl !== "undefined" && Intl.Segmenter) {
          const segmenter = new Intl.Segmenter(undefined, { granularity: "grapheme" });
          return Array.from(segmenter.segment(text), (s) => s.segment);
        }
        return Array.from(text);
      }

      function startAnnouncementBanner(messages) {
        const banner = document.getElementById("announcementBanner");
        const textEl = document.getElementById("announcementText");
        clearTimeout(announcementTimer);

        if (!messages || messages.length === 0) {
          banner.classList.remove("visible");
          return;
        }

        banner.classList.add("visible");
        let msgIndex = 0;
        let charIndex = 0;
        let isDeleting = false;
        let graphemes = segmentGraphemes(messages[0]);

        function tick() {
          if (!isDeleting) {
            charIndex++;
            textEl.textContent = graphemes.slice(0, charIndex).join("");
            if (charIndex >= graphemes.length) {
              if (messages.length === 1) return;
              isDeleting = true;
              announcementTimer = setTimeout(tick, 2400);
              return;
            }
            announcementTimer = setTimeout(tick, 45);
          } else {
            charIndex--;
            textEl.textContent = graphemes.slice(0, charIndex).join("");
            if (charIndex <= 0) {
              isDeleting = false;
              msgIndex = (msgIndex + 1) % messages.length;
              graphemes = segmentGraphemes(messages[msgIndex]);
              announcementTimer = setTimeout(tick, 350);
              return;
            }
            announcementTimer = setTimeout(tick, 22);
          }
        }

        textEl.textContent = "";
        tick();
      }

      // ==========================================
      // 5. FETCH PRODUCTS FROM GOOGLE SHEETS
      // ==========================================
      function renderSkeletons() {
        const grid = document.getElementById("productsGrid");
        grid.innerHTML = Array.from({ length: 6 }).map(() => `
          <div class="skeleton-card">
            <div class="skeleton-box" style="width:100%; aspect-ratio:1/1;"></div>
            <div style="padding:10px;">
              <div class="skeleton-box" style="height:14px; width:80%; border-radius:4px; margin-bottom:8px;"></div>
              <div class="skeleton-box" style="height:10px; width:100%; border-radius:4px; margin-bottom:6px;"></div>
              <div class="skeleton-box" style="height:28px; width:100%; border-radius:6px; margin-top:10px;"></div>
            </div>
          </div>
        `).join("");
      }

      function loadProducts() {
        renderSkeletons();
        const url = CONFIG.productsCsvUrl + (CONFIG.productsCsvUrl.includes("?") ? "&" : "?") + "t=" + Date.now();

        if (!CONFIG.productsCsvUrl || CONFIG.productsCsvUrl.includes("[")) {
          const parsed = buildProductObjects(SAMPLE_PRODUCTS);
          products = parsed.list;
          renderProducts();
          return;
        }

        Papa.parse(url, {
          download: true,
          header: true,
          skipEmptyLines: true,
          complete: (results) => {
            const parsed = buildProductObjects(results.data || []);
            if (parsed.list.length > 0) {
              products = parsed.list;
              startAnnouncementBanner(parsed.announcements);
            } else {
              const fallback = buildProductObjects(SAMPLE_PRODUCTS);
              products = fallback.list;
              showToast("Loaded sample catalog (sheet empty)", "default");
            }
            renderProducts();
            syncCartBadges();
          },
          error: () => {
            const fallback = buildProductObjects(SAMPLE_PRODUCTS);
            products = fallback.list;
            renderProducts();
            showToast("Offline mode: showing Wayanad catalog", "default");
          }
        });
      }

      // ==========================================
      // 6. CART LOGIC
      // ==========================================
      function getCartKey(productId, weightKey) {
        return `${productId}__${weightKey}`;
      }

      function getCartQty(productId, weightKey) {
        const item = cart[getCartKey(productId, weightKey)];
        return item ? item.qty : 0;
      }

      function updateCart(productId, weightKey, delta) {
        const product = products.find((p) => p.id === productId);
        if (!product || product.outOfStock) return;
        const tier = product.tiers.find((t) => t.key === weightKey);
        if (!tier) return;

        const key = getCartKey(productId, weightKey);
        const currentQty = cart[key] ? cart[key].qty : 0;
        const nextQty = currentQty + delta;

        if (nextQty <= 0) {
          delete cart[key];
          showToast(`Removed ${product.name} (${tier.label})`);
        } else {
          cart[key] = {
            productId: product.id,
            name: product.name,
            image: product.image,
            fallbackImage: product.fallbackImage,
            weightKey: tier.key,
            weightLabel: tier.label,
            price: tier.price,
            qty: nextQty
          };
          if (currentQty === 0) {
            showToast(`Added ${product.name} (${tier.label})`, "success");
          }
        }

        saveJSON("wff_cart", cart);
        syncCartBadges();
        renderProducts(document.getElementById("searchInput").value);
        if (document.getElementById("view-cart").classList.contains("active")) {
          renderCart();
        }
        if (activeModalProductId === productId) {
          renderModalAction(product);
        }
      }

      function getCartTotals() {
        const items = Object.values(cart);
        let count = 0;
        let amount = 0;
        items.forEach((item) => {
          count += item.qty;
          amount += item.price * item.qty;
        });
        return { items, count, amount };
      }

      function syncCartBadges() {
        const { count } = getCartTotals();
        const badges = [
          document.getElementById("desktopCartBadge"),
          document.getElementById("mobileCartBadge")
        ];
        badges.forEach((b) => {
          b.textContent = count;
          b.classList.toggle("hidden", count === 0);
        });

        const floatingBtn = document.getElementById("floatingCartBtn");
        const floatingBadge = document.getElementById("floatingCartBadge");
        floatingBadge.textContent = count;
        const isCartActive = document.getElementById("view-cart").classList.contains("active");
        floatingBtn.classList.toggle("visible", count > 0 && !isCartActive);
      }

      // ==========================================
      // 7. SEARCH & PRODUCT GRID RENDERING
      // ==========================================
      function matchesSearch(product, rawQuery) {
        const q = rawQuery.trim().toLowerCase();
        if (!q) return true;

        const haystack = (product.name + " " + product.description).toLowerCase();
        const words = q.split(/\s+/).filter(Boolean);

        return words.every((word) => {
          if (haystack.includes(word)) return true;
          for (const [dictKey, synonyms] of Object.entries(SEARCH_SYNONYMS)) {
            if (dictKey.includes(word) || word.includes(dictKey)) {
              if (synonyms.some((syn) => haystack.includes(syn))) return true;
            }
          }
          return false;
        });
      }

      function renderProducts(query = "") {
        const grid = document.getElementById("productsGrid");
        const filtered = products.filter((p) => matchesSearch(p, query));

        if (filtered.length === 0) {
          grid.innerHTML = `
            <div class="empty-state" style="grid-column: 1 / -1;">
              <span class="empty-state-icon">🔍</span>
              <h3>No matching products found</h3>
              <p>Try searching for pepper, coffee, kappi, chukku, manjal, or kudampuli.</p>
            </div>
          `;
          return;
        }

        grid.innerHTML = filtered.map((product) => {
          const weightKey = selectedWeights[product.id] || product.tiers[0].key;
          const tier = product.tiers.find((t) => t.key === weightKey) || product.tiers[0];
          const qty = getCartQty(product.id, tier.key);

          const actionHtml = product.outOfStock
            ? ""
            : qty > 0
              ? `<div class="qty-pill" data-stop-card="true">
                  <button type="button" data-action="dec" data-id="${product.id}" data-weight="${tier.key}" aria-label="Decrease quantity">−</button>
                  <span>${qty}</span>
                  <button type="button" data-action="inc" data-id="${product.id}" data-weight="${tier.key}" aria-label="Increase quantity">+</button>
                </div>`
              : `<button type="button" class="btn-plus" data-stop-card="true" data-action="inc" data-id="${product.id}" data-weight="${tier.key}" aria-label="Add to cart">+</button>`;

          const optionsHtml = product.tiers.map((t) =>
            `<option value="${t.key}" ${t.key === tier.key ? "selected" : ""}>${t.label} — ₹${t.price}</option>`
          ).join("");

          return `
            <article class="product-card ${product.outOfStock ? "out-of-stock" : ""}" data-card-id="${product.id}">
              <div class="product-img-wrap">
                <img
                  class="product-img"
                  src="${escapeHtml(product.image)}"
                  alt="${escapeHtml(product.name)}"
                  loading="lazy"
                  onerror="this.onerror=null;this.src='${product.fallbackImage}';"
                />
                ${product.outOfStock ? `<div class="oos-badge"><span>OUT OF STOCK</span></div>` : ""}
                <div class="card-action-float">${actionHtml}</div>
              </div>
              <div class="product-body">
                <h3 class="product-title" title="${escapeHtml(product.name)}">${escapeHtml(product.name)}</h3>
                <p class="product-desc">${escapeHtml(product.description)}</p>
                <div class="product-controls">
                  <select
                    class="size-select"
                    data-stop-card="true"
                    data-size-id="${product.id}"
                    ${product.outOfStock ? "disabled" : ""}
                    aria-label="Select weight for ${escapeHtml(product.name)}"
                  >
                    ${optionsHtml}
                  </select>
                  <div class="price-row">
                    <span class="product-price">₹${tier.price}</span>
                    <span class="unit-tag">${tier.label}</span>
                  </div>
                </div>
              </div>
            </article>
          `;
        }).join("");
      }

      // ==========================================
      // 8. PRODUCT DETAILS BOTTOM-SHEET MODAL
      // ==========================================
      function openProductModal(productId) {
        const product = products.find((p) => p.id === productId);
        if (!product) return;

        activeModalProductId = productId;
        const imgEl = document.getElementById("modalProductImg");
        imgEl.src = product.image;
        imgEl.alt = product.name;
        imgEl.className = "modal-product-img" + (product.outOfStock ? " oos" : "");
        imgEl.onerror = () => { imgEl.onerror = null; imgEl.src = product.fallbackImage; };

        document.getElementById("modalProductTitle").textContent = product.name;
        document.getElementById("modalProductDesc").textContent = product.description;

        const selectEl = document.getElementById("modalSizeSelect");
        const currentWeight = selectedWeights[product.id] || product.tiers[0].key;
        selectEl.innerHTML = product.tiers.map((t) =>
          `<option value="${t.key}" ${t.key === currentWeight ? "selected" : ""}>${t.label} — ₹${t.price}</option>`
        ).join("");
        selectEl.disabled = product.outOfStock;

        syncModalPriceAndAction(product);
        document.getElementById("productModalBackdrop").classList.add("open");
        document.body.style.overflow = "hidden";
      }

      function syncModalPriceAndAction(product) {
        const weightKey = selectedWeights[product.id] || product.tiers[0].key;
        const tier = product.tiers.find((t) => t.key === weightKey) || product.tiers[0];
        document.getElementById("modalProductPrice").textContent = `₹${tier.price}`;
        renderModalAction(product);
      }

      function renderModalAction(product) {
        const container = document.getElementById("modalActionContainer");
        const weightKey = selectedWeights[product.id] || product.tiers[0].key;
        const tier = product.tiers.find((t) => t.key === weightKey) || product.tiers[0];
        const qty = getCartQty(product.id, tier.key);

        if (product.outOfStock) {
          container.innerHTML = `<button type="button" class="btn-primary-full" disabled>Out of Stock</button>`;
          return;
        }

        if (qty > 0) {
          container.innerHTML = `
            <div class="modal-qty-full">
              <button type="button" id="modalDecBtn" aria-label="Decrease quantity">−</button>
              <span>${qty} in Cart (${tier.label})</span>
              <button type="button" id="modalIncBtn" aria-label="Increase quantity">+</button>
            </div>
          `;
          document.getElementById("modalDecBtn").onclick = () => updateCart(product.id, tier.key, -1);
          document.getElementById("modalIncBtn").onclick = () => updateCart(product.id, tier.key, 1);
        } else {
          container.innerHTML = `
            <button type="button" id="modalAddBtn" class="btn-primary-full btn-green-full">
              Add to Cart — ₹${tier.price}
            </button>
          `;
          document.getElementById("modalAddBtn").onclick = () => updateCart(product.id, tier.key, 1);
        }
      }

      function closeProductModal() {
        activeModalProductId = null;
        document.getElementById("productModalBackdrop").classList.remove("open");
        document.body.style.overflow = "";
      }

      // ==========================================
      // 9. CART VIEW & CHECKOUT
      // ==========================================
      function renderCart() {
        const { items, count, amount } = getCartTotals();
        const container = document.getElementById("cartContainer");
        const clearBtn = document.getElementById("clearCartBtn");

        clearBtn.style.display = items.length > 0 ? "inline-block" : "none";

        if (items.length === 0) {
          container.innerHTML = `
            <div class="empty-state">
              <span class="empty-state-icon">🛒</span>
              <h3>Your cart is empty</h3>
              <p>Add farm-fresh Wayanad spices & coffee to get started.</p>
              <button type="button" class="btn-outline" id="goShopBtn">Browse Products</button>
            </div>
          `;
          document.getElementById("goShopBtn").onclick = () => switchTab("products");
          return;
        }

        const listHtml = items.map((item) => `
          <div class="cart-item">
            <img
              class="cart-item-img"
              src="${escapeHtml(item.image)}"
              alt="${escapeHtml(item.name)}"
              onerror="this.onerror=null;this.src='${item.fallbackImage || makeFallbackImage(item.name)}';"
            />
            <div class="cart-item-info">
              <h4 class="cart-item-title">${escapeHtml(item.name)}</h4>
              <div class="cart-item-meta">${escapeHtml(item.weightLabel)} × ₹${item.price}</div>
              <div class="cart-item-price">₹${item.price * item.qty}</div>
            </div>
            <div class="qty-pill">
              <button type="button" data-cart-dec="${item.productId}" data-cart-weight="${item.weightKey}" aria-label="Decrease">−</button>
              <span>${item.qty}</span>
              <button type="button" data-cart-inc="${item.productId}" data-cart-weight="${item.weightKey}" aria-label="Increase">+</button>
            </div>
          </div>
        `).join("");

        container.innerHTML = `
          <div class="cart-list">${listHtml}</div>
          <div class="cart-summary-card">
            <div class="summary-row">
              <span>Items (${count})</span>
              <span>₹${amount}</span>
            </div>
            <div class="summary-row total">
              <span>Order Total</span>
              <span>₹${amount}</span>
            </div>
            <button type="button" id="openCheckoutBtn" class="btn-primary-full">
              Proceed to Checkout →
            </button>
          </div>
        `;

        document.getElementById("openCheckoutBtn").onclick = openCheckoutModal;
      }

      function openCheckoutModal() {
        const { count, amount } = getCartTotals();
        if (count === 0) {
          showToast("Your cart is empty", "error");
          return;
        }

        const saved = loadJSON("wff_customer", { name: "", phone: "", address: "" });
        document.getElementById("custName").value = saved.name || "";
        document.getElementById("custPhone").value = saved.phone || "";
        document.getElementById("custAddress").value = saved.address || "";
        document.getElementById("checkoutMiniSummary").innerHTML = `
          <span>${count} item${count > 1 ? "s" : ""}</span>
          <span>Total: ₹${amount}</span>
        `;

        document.getElementById("checkoutModalBackdrop").classList.add("open");
        document.body.style.overflow = "hidden";
      }

      function closeCheckoutModal() {
        document.getElementById("checkoutModalBackdrop").classList.remove("open");
        document.body.style.overflow = "";
      }

      function handleCheckoutSubmit(e) {
        e.preventDefault();
        const name = document.getElementById("custName").value.trim();
        const phoneDigits = document.getElementById("custPhone").value.replace(/\D/g, "");
        const address = document.getElementById("custAddress").value.trim();

        if (!name) {
          showToast("Please enter your name", "error");
          return;
        }
        if (!/^\d{10}$/.test(phoneDigits)) {
          showToast("Please enter a valid 10-digit mobile number", "error");
          return;
        }
        if (!address) {
          showToast("Please enter your delivery address", "error");
          return;
        }

        const { items, amount } = getCartTotals();
        if (items.length === 0) {
          showToast("Your cart is empty", "error");
          return;
        }

        saveJSON("wff_customer", { name, phone: phoneDigits, address });
        document.getElementById("orderPhoneInput").value = phoneDigits;

        const lines = items.map((it, i) =>
          `${i + 1}. ${it.name} (${it.weightLabel}) x ${it.qty} = ₹${it.price * it.qty}`
        ).join("\n");

        const orderSummary =
`🌿 *New Order — ${CONFIG.brandName}*
------------------------
*Name:* ${name}
*Phone:* ${phoneDigits}
*Address:* ${address}
------------------------
*Items:*
${lines}
------------------------
*Total Amount:* ₹${amount}`;

        // Silent submission to Google Form (no-cors)
        try {
          const formData = new URLSearchParams();
          formData.append(CONFIG.formEntryId, orderSummary);
          fetch(CONFIG.formResponseUrl, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "application/x-www-form-urlencoded" },
            body: formData.toString()
          }).catch(() => {});
        } catch { /* ignore background form errors */ }

        const waUrl = `https://wa.me/${CONFIG.whatsappNumber}?text=${encodeURIComponent(orderSummary)}`;
        window.open(waUrl, "_blank", "noopener");

        cart = {};
        saveJSON("wff_cart", cart);
        syncCartBadges();
        closeCheckoutModal();
        renderCart();
        renderProducts(document.getElementById("searchInput").value);
        showToast("Order sent! Opening WhatsApp...", "success");
      }

      // ==========================================
      // 10. MY ORDERS TAB (RESPONSES CSV LOOKUP)
      // ==========================================
      function lookupOrders(phoneRaw) {
        const digits = String(phoneRaw || "").replace(/\D/g, "");
        const last10 = digits.slice(-10);
        const listEl = document.getElementById("ordersList");

        if (last10.length !== 10) {
          listEl.innerHTML = `
            <div class="empty-state">
              <span class="empty-state-icon">📱</span>
              <h3>Enter your 10-digit mobile number</h3>
              <p>We will fetch your past orders placed with ${CONFIG.brandName}.</p>
            </div>
          `;
          return;
        }

        listEl.innerHTML = `
          <div class="empty-state">
            <span class="empty-state-icon">⏳</span>
            <h3>Fetching your orders...</h3>
            <p>Checking records for ${last10}</p>
          </div>
        `;

        const url = CONFIG.ordersCsvUrl + (CONFIG.ordersCsvUrl.includes("?") ? "&" : "?") + "t=" + Date.now();

        Papa.parse(url, {
          download: true,
          header: false,
          skipEmptyLines: true,
          complete: (results) => {
            const rows = results.data || [];
            if (rows.length <= 1) {
              renderNoOrders(last10);
              return;
            }

            const matched = [];
            for (let i = 1; i < rows.length; i++) {
              const row = rows[i];
              const joined = row.join(" ");
              const phoneMatches = joined.match(/\d[\d\s\-+]{8,}\d/g) || [];
              const found = phoneMatches.some((m) => m.replace(/\D/g, "").slice(-10) === last10)
                || joined.replace(/\D/g, "").includes(last10);

              if (found) {
                const timestamp = row[0] || "Recent Order";
                const details = row.slice(1).filter(Boolean).join("\n\n").trim();
                matched.push({ timestamp, details: details || joined });
              }
            }

            if (matched.length === 0) {
              renderNoOrders(last10);
              return;
            }

            matched.reverse();
            listEl.innerHTML = matched.map((ord) => `
              <article class="order-card">
                <div class="order-card-top">
                  <span class="order-date">🗓 ${escapeHtml(ord.timestamp)}</span>
                  <span class="order-status-pill">Recorded</span>
                </div>
                <pre class="order-body-pre">${escapeHtml(ord.details)}</pre>
              </article>
            `).join("");
          },
          error: () => {
            listEl.innerHTML = `
              <div class="empty-state">
                <span class="empty-state-icon">⚠️</span>
                <h3>Could not load orders</h3>
                <p>Please check your internet connection and try again.</p>
              </div>
            `;
          }
        });
      }

      function renderNoOrders(last10) {
        document.getElementById("ordersList").innerHTML = `
          <div class="empty-state">
            <span class="empty-state-icon">📦</span>
            <h3>No orders found for ${escapeHtml(last10)}</h3>
            <p>Orders placed via this store will appear here automatically.</p>
          </div>
        `;
      }

      // ==========================================
      // 11. NAVIGATION & SHARE
      // ==========================================
      function switchTab(tabName) {
        document.querySelectorAll(".view-section").forEach((s) => s.classList.remove("active"));
        const target = document.getElementById(`view-${tabName}`);
        if (target) target.classList.add("active");

        document.querySelectorAll("[data-tab]").forEach((btn) => {
          btn.classList.toggle("active", btn.getAttribute("data-tab") === tabName);
        });

        if (tabName === "cart") {
          renderCart();
        } else if (tabName === "orders") {
          const input = document.getElementById("orderPhoneInput");
          if (!input.value) {
            const saved = loadJSON("wff_customer", {});
            if (saved.phone) input.value = saved.phone;
          }
          lookupOrders(input.value);
        }

        syncCartBadges();
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      async function shareStore() {
        const shareData = {
          title: CONFIG.brandName,
          text: `${CONFIG.brandName} — ${CONFIG.tagline}. Order fresh spices & coffee online:`,
          url: window.location.href
        };

        if (navigator.share) {
          try {
            await navigator.share(shareData);
            return;
          } catch (err) {
            if (err && err.name === "AbortError") return;
          }
        }

        const waShare = `https://wa.me/?text=${encodeURIComponent(shareData.text + " " + shareData.url)}`;
        window.open(waShare, "_blank", "noopener");
      }

      // ==========================================
      // 12. EVENT LISTENERS
      // ==========================================
      function bindEvents() {
        document.querySelectorAll("[data-tab]").forEach((btn) => {
          btn.addEventListener("click", () => switchTab(btn.getAttribute("data-tab")));
        });

        document.getElementById("floatingCartBtn").addEventListener("click", () => switchTab("cart"));
        document.getElementById("mobileShareBtn").addEventListener("click", shareStore);
        document.getElementById("desktopShareBtn").addEventListener("click", shareStore);

        const searchInput = document.getElementById("searchInput");
        const searchClear = document.getElementById("searchClear");

        searchInput.addEventListener("input", (e) => {
          const val = e.target.value;
          searchClear.classList.toggle("visible", val.length > 0);

          if (val.trim().toLowerCase() === "admin") {
            searchInput.value = "";
            searchClear.classList.remove("visible");
            window.location.href = "admin.html";
            return;
          }

          renderProducts(val);
        });

        searchClear.addEventListener("click", () => {
          searchInput.value = "";
          searchClear.classList.remove("visible");
          renderProducts("");
          searchInput.focus();
        });

        const grid = document.getElementById("productsGrid");

        grid.addEventListener("click", (e) => {
          const actionBtn = e.target.closest("[data-action]");
          if (actionBtn) {
            e.stopPropagation();
            const id = actionBtn.getAttribute("data-id");
            const weight = actionBtn.getAttribute("data-weight");
            const delta = actionBtn.getAttribute("data-action") === "inc" ? 1 : -1;
            updateCart(id, weight, delta);
            return;
          }

          if (e.target.closest("[data-stop-card]")) {
            e.stopPropagation();
            return;
          }

          const card = e.target.closest("[data-card-id]");
          if (card) {
            openProductModal(card.getAttribute("data-card-id"));
          }
        });

        grid.addEventListener("change", (e) => {
          const select = e.target.closest("[data-size-id]");
          if (select) {
            const id = select.getAttribute("data-size-id");
            selectedWeights[id] = select.value;
            renderProducts(searchInput.value);
          }
        });

        document.getElementById("closeProductModal").addEventListener("click", closeProductModal);
        document.getElementById("productModalBackdrop").addEventListener("click", (e) => {
          if (e.target.id === "productModalBackdrop") closeProductModal();
        });
        document.getElementById("modalSizeSelect").addEventListener("change", (e) => {
          if (!activeModalProductId) return;
          selectedWeights[activeModalProductId] = e.target.value;
          const product = products.find((p) => p.id === activeModalProductId);
          if (product) {
            syncModalPriceAndAction(product);
            renderProducts(searchInput.value);
          }
        });

        document.getElementById("cartContainer").addEventListener("click", (e) => {
          const decBtn = e.target.closest("[data-cart-dec]");
          if (decBtn) {
            updateCart(decBtn.getAttribute("data-cart-dec"), decBtn.getAttribute("data-cart-weight"), -1);
            return;
          }
          const incBtn = e.target.closest("[data-cart-inc]");
          if (incBtn) {
            updateCart(incBtn.getAttribute("data-cart-inc"), incBtn.getAttribute("data-cart-weight"), 1);
          }
        });

        document.getElementById("clearCartBtn").addEventListener("click", () => {
          cart = {};
          saveJSON("wff_cart", cart);
          syncCartBadges();
          renderCart();
          renderProducts(searchInput.value);
          showToast("Cart cleared");
        });

        document.getElementById("closeCheckoutModal").addEventListener("click", closeCheckoutModal);
        document.getElementById("checkoutModalBackdrop").addEventListener("click", (e) => {
          if (e.target.id === "checkoutModalBackdrop") closeCheckoutModal();
        });
        document.getElementById("checkoutForm").addEventListener("submit", handleCheckoutSubmit);

        document.getElementById("orderLookupForm").addEventListener("submit", (e) => {
          e.preventDefault();
          lookupOrders(document.getElementById("orderPhoneInput").value);
        });

        document.addEventListener("keydown", (e) => {
          if (e.key === "Escape") {
            closeProductModal();
            closeCheckoutModal();
          }
        });
      }

      // ==========================================
      // 13. INITIALIZE
      // ==========================================
      bindEvents();
      syncCartBadges();
      loadProducts();
    })();
  </script>
</body>
</html>
