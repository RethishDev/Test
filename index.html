<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sasreya Foods</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; display: flex; height: 100vh; background-color: #f4f6f8; overflow: hidden; }
        
        /* --- Sidebar Navigation --- */
        .sidebar { width: 250px; background: #fff; padding: 20px; box-shadow: 2px 0 5px rgba(0,0,0,0.05); display: flex; flex-direction: column; z-index: 10; }
        .sidebar-header { display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 5px; }
        .brand-logo { width: 45px; height: 45px; border-radius: 8px; object-fit: cover; box-shadow: 0 2px 5px rgba(0,0,0,0.15); border: 1px solid #eaeaea; }
        .brand-name { color: #2c3e50; margin: 0; font-size: 1.5em; text-align: left; font-weight: 800; letter-spacing: -0.5px; } 
        .sidebar p { text-align: center; color: #777; font-size: 0.85em; margin-bottom: 30px; margin-top: 5px; }
        
        .nav-links { display: flex; flex-direction: column; gap: 10px; }
        .nav-btn { background: transparent; color: #555; border: none; padding: 12px 15px; border-radius: 8px; font-size: 1.1em; cursor: pointer; text-align: left; font-weight: bold; transition: 0.2s; display: flex; justify-content: space-between; align-items: center;}
        .nav-btn:hover { background: #f0fdf4; color: #2ecc71; }
        .nav-btn.active { background: #2ecc71; color: white; }
        .nav-badge { background: #e74c3c; color: white; padding: 2px 8px; border-radius: 12px; font-size: 0.8em; display: none; }

        /* --- Main Content Area --- */
        .main-content { flex: 1; padding: 30px; overflow-y: auto; }
        .view { display: none; animation: fadeIn 0.3s; }
        .view.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* --- Zepto-Style Products Grid --- */
        /* FIX: Added minmax(0, 1fr) to force perfectly equal columns */
        .products { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; } 
        
        @media (min-width: 768px) {
            .products { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; }
        }

        .product-card { background: white; padding: 10px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); position: relative; display: flex; flex-direction: column; cursor: pointer;}
        
        /* Image & Floating Button Container */
        .image-container { position: relative; margin-bottom: 15px; }
        .product-card img { width: 100%; height: 120px; object-fit: cover; border-radius: 8px; display: block; background: #f9f9f9;}
        
        .action-container { position: absolute; bottom: -12px; right: 8px; z-index: 5; }
        
        /* Small Floating + Button */
        .add-plus-btn { width: 34px; height: 34px; background: white; color: #e74c3c; border: 1.5px solid #e74c3c; border-radius: 50%; font-size: 24px; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.15); line-height: 0; padding-bottom: 2px; transition: 0.1s;}
        .add-plus-btn:hover { background: #e74c3c; color: white; }
        
        /* Small Floating Qty Pill */
        .tiny-qty { background: #e74c3c; color: white; border-radius: 20px; display: flex; align-items: center; justify-content: space-between; width: 75px; height: 32px; box-shadow: 0 2px 5px rgba(0,0,0,0.15); overflow: hidden; border: 1.5px solid #e74c3c;}
        .tiny-qty button { background: transparent; border: none; color: white; font-weight: bold; width: 25px; cursor: pointer; font-size: 1.2em; display: flex; align-items: center; justify-content: center;}
        .tiny-qty span { font-weight: bold; font-size: 0.9em; }

        /* Typography & Controls */
        .product-title { font-size: 0.9em; margin: 0 0 3px 0; color: #2c3e50; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: bold;}
        .product-desc { font-size: 0.75em; color: #777; margin: 0 0 8px 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.3;}
        
        .bottom-card-row { display: flex; flex-direction: column; gap: 5px; margin-top: auto; }
        .weight-select { width: 100%; padding: 6px; border-radius: 6px; border: 1px solid #ddd; font-size: 0.8em; outline: none; background: #fdfdfd;}
        .price { font-size: 0.95em; font-weight: bold; color: #333; margin: 0; }
        
        /* --- Product Details Modal (Bottom Sheet on Mobile) --- */
        .product-modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 3000; align-items: flex-end; justify-content: center; }
        .product-modal-content { background: white; border-radius: 20px 20px 0 0; width: 100%; max-width: 500px; max-height: 90vh; overflow-y: auto; animation: slideUp 0.3s; position: relative; padding-bottom: 20px;}
        
        @media (min-width: 768px) { 
            .product-modal-overlay { align-items: center; padding: 20px; }
            .product-modal-content { border-radius: 15px; padding-bottom: 0;}
        }

        .product-modal-img-container { position: relative; }
        .product-modal-img-container img { width: 100%; height: 280px; object-fit: cover; }
        .close-modal-btn { position: absolute; top: 15px; right: 15px; background: rgba(255,255,255,0.9); border: none; border-radius: 50%; width: 36px; height: 36px; font-size: 18px; cursor: pointer; color: #333; z-index: 10; box-shadow: 0 2px 5px rgba(0,0,0,0.2); display: flex; align-items: center; justify-content: center; font-weight: bold;}
        
        .product-modal-body { padding: 20px; }
        .product-modal-title { margin-top: 0; color: #2c3e50; font-size: 1.4em; margin-bottom: 5px;}
        .product-modal-desc { color: #666; line-height: 1.5; font-size: 0.95em; margin-bottom: 20px;}
        .product-modal-price { font-size: 1.4em; font-weight: bold; color: #333; margin-bottom: 15px; display: flex; align-items: center; justify-content: space-between;}
        
        .modal-weight-select { width: 100%; padding: 12px; font-size: 1.1em; margin-bottom: 20px; border-radius: 8px; border: 1px solid #ccc;}
        .big-add-btn { background: #e74c3c; color: white; border: none; padding: 15px; border-radius: 8px; cursor: pointer; width: 100%; font-weight: bold; font-size: 1.2em; transition: 0.2s;}
        
        .modal-qty-controls { display: flex; align-items: center; justify-content: space-between; background: #fff; border: 2px solid #e74c3c; border-radius: 8px; height: 50px; overflow: hidden;}
        .modal-qty-controls button { width: 30%; background: transparent; color: #e74c3c; font-size: 1.8em; border: none; cursor: pointer; height: 100%; font-weight: bold;}
        .modal-qty-controls span { width: 40%; font-weight: bold; text-align: center; font-size: 1.2em; color: #e74c3c;}

        /* --- Cart & Checkout Modals --- */
        .cart-container { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); max-width: 600px; margin: 0 auto; }
        .cart-item { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid #eee; padding-bottom: 15px; }
        .cart-item-details { text-align: left; }
        .cart-item-details small { color: #777; display: block; margin-top: 4px;}
        
        .cart-qty { border: 1px solid #ddd; background: #fff; border-radius: 6px; display: flex; align-items: center; width: 90px; height: 35px;}
        .cart-qty button { width: 30px; background: none; border: none; font-size: 1.2em; cursor: pointer;}
        .cart-qty span { flex: 1; text-align: center; font-weight: bold;}

        .whatsapp-btn { background: #25D366; color: white; border: none; padding: 15px; border-radius: 8px; cursor: pointer; width: 100%; font-weight: bold; font-size: 1.1em; margin-top: 20px;}
        
        .floating-cart { position: fixed; bottom: 25px; right: 25px; width: 65px; height: 65px; background: #2ecc71; color: white; border-radius: 50%; display: none; align-items: center; justify-content: center; font-size: 28px; cursor: pointer; box-shadow: 0 4px 12px rgba(46, 204, 113, 0.4); border: none; z-index: 1001; transition: transform 0.2s;}
        .floating-badge { position: absolute; top: -2px; right: -2px; background: #e74c3c; color: white; border-radius: 50%; width: 24px; height: 24px; font-size: 12px; font-weight: bold; display: flex; align-items: center; justify-content: center; border: 2px solid white; }

        .loader-container { grid-column: 1 / -1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 50px 0; color: #777; }
        .spinner { width: 45px; height: 45px; border: 4px solid #f3f3f3; border-top: 4px solid #2ecc71; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 15px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Checkout Modal */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 2000; align-items: center; justify-content: center; padding: 15px; }
        .modal-content { background: white; padding: 25px; border-radius: 15px; width: 100%; max-width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); animation: slideUp 0.3s; }
        
        .modal-content h3 { margin-top: 0; color: #2c3e50; font-size: 1.4em; border-bottom: 2px solid #eee; padding-bottom: 10px; margin-bottom: 20px;}
        .input-group { margin-bottom: 15px; }
        .input-group input[type="text"], .input-group input[type="tel"] { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 1em; font-family: inherit; outline: none;}
        .radio-group { display: flex; align-items: center; gap: 10px; margin-bottom: 15px; background: #f0fdf4; padding: 12px; border-radius: 8px; border: 1px solid #2ecc71; cursor: pointer;}
        .radio-group input[type="checkbox"] { width: 20px; height: 20px; accent-color: #2ecc71; cursor: pointer; }
        
        .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
        .modal-actions button { flex: 1; padding: 12px; font-size: 1.1em; border-radius: 8px; cursor: pointer; font-weight: bold; border: none; }
        .cancel-btn { background: #f1f2f6; color: #555; }
        .confirm-btn { background: #25D366; color: white; }

       /* --- FIX: Mobile Responsiveness & Sticky Header --- */
        @media (max-width: 768px) {
            body { 
                display: block; /* Switch off flex layout to allow native scrolling */
                height: auto; 
                overflow-x: hidden; /* Stops horizontal shift/zooming */
                overflow-y: auto; /* <-- THIS RE-ENABLES VERTICAL SCROLLING */
            }
            .sidebar { 
                width: 100%; 
                padding: 15px; 
                box-shadow: 0 2px 8px rgba(0,0,0,0.1); 
                position: sticky; /* Locks it to the top */
                top: 0; 
                z-index: 1000; 
                background: white;
            }
            .sidebar-header { justify-content: flex-start; margin-bottom: 5px; }
            .sidebar p { display: block; margin-top: 0; margin-bottom: 15px; text-align: left; } 
            .nav-links { flex-direction: row; gap: 10px; }
            .nav-btn { flex: 1; padding: 10px; font-size: 1em; justify-content: center; gap: 8px;}
            
            .main-content { padding: 15px; overflow-y: visible; }
            .cart-container { padding: 15px; }
        }
    </style>
</head>
<body>

    <!-- Sidebar Navigation -->
    <div class="sidebar">
        <div class="sidebar-header">
            <!-- Animated SVG Logo -->
            <svg class="brand-logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" style="background: #2c3e50; padding: 5px; box-sizing: border-box;">
                <style>
                    .float { animation: float 3s ease-in-out infinite; transform-origin: 50px 50px; }
                    .wiggle { animation: wiggle 2s ease-in-out infinite; transform-origin: 50px 50px; }
                    @keyframes float { 0%, 100% { transform: translateY(0px) rotate(0deg); } 50% { transform: translateY(-6px) rotate(5deg); } }
                    @keyframes wiggle { 0%, 100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg); } }
                </style>
                
                <!-- Pickle Jar (Wiggling) -->
                <g class="wiggle">
                    <!-- Jar Body -->
                    <rect x="18" y="40" width="40" height="45" rx="8" fill="#f1c40f" />
                    <!-- Jar Lid -->
                    <rect x="14" y="30" width="48" height="12" rx="3" fill="#e74c3c" />
                    <!-- Label -->
                    <rect x="25" y="52" width="26" height="18" rx="3" fill="#fff" opacity="0.9"/>
                    <text x="38" y="65" font-family="Arial" font-size="12" font-weight="bold" fill="#2c3e50" text-anchor="middle">SF</text>
                </g>
                
                <!-- Golden Chip (Floating) -->
                <g class="float">
                    <path d="M 60 30 Q 75 15 90 40 Q 80 60 65 50 Q 50 40 60 30" fill="#f39c12" stroke="#e67e22" stroke-width="2"/>
                </g>
            </svg>
            <h2 class="brand-name">Sasreya Foods</h2>
        </div>
        <p>Homemade Pickles & Snacks</p>
        <div class="nav-links">
            <button class="nav-btn active" id="nav-products" onclick="switchTab('products')">🛍️ Products</button>
            <button class="nav-btn" id="nav-cart" onclick="switchTab('cart')">🛒 Cart <span class="nav-badge" id="nav-cart-badge">0</span></button>
        </div>
    </div>

    <!-- Main Content Area -->
    <div class="main-content">
        <!-- Products View -->
        <div id="products-tab" class="view active">
            <div class="products" id="product-list">
                <div class="loader-container">
                    <div class="spinner"></div>
                    <p>Loading fresh items from the kitchen...</p>
                </div>
            </div>
        </div>

        <!-- Cart View -->
        <div id="cart-tab" class="view">
            <div class="cart-container">
                <h2 style="margin-top: 0; color: #333;">Your Shopping Cart</h2>
                <div id="cart-items">
                    <p style="color: #777;">Your cart is empty.</p>
                </div>
                <h3 style="margin-top: 20px; border-top: 2px solid #eee; padding-top: 15px;">
                    Total Amount: ₹<span id="cart-total">0</span>
                </h3>
                <button class="whatsapp-btn" onclick="openCheckoutModal()">Proceed to Checkout</button>
            </div>
        </div>
    </div>

    <button class="floating-cart" id="floating-cart" onclick="switchTab('cart')">
        🛒 <span class="floating-badge" id="floating-badge">0</span>
    </button>

    <!-- Product Details Modal -->
    <div class="product-modal-overlay" id="product-modal-overlay" onclick="closeProductModalOutside(event)">
        <div class="product-modal-content">
            <div class="product-modal-img-container">
                <img id="modal-img" src="" alt="Product">
                <button class="close-modal-btn" onclick="closeProductModal()">✕</button>
            </div>
            
            <div class="product-modal-body">
                <h2 class="product-modal-title" id="modal-title">Title</h2>
                <p class="product-modal-desc" id="modal-desc">Description</p>
                
                <div class="product-modal-price">
                    <span>Price</span>
                    <span id="modal-price">₹0</span>
                </div>
                
                <select id="modal-weight" class="modal-weight-select" onchange="updateModalUI()">
                    <option value="" disabled selected>-- Choose Size --</option>
                    <option value="0.25">250 g</option>
                    <option value="0.5">500 g</option>
                    <option value="1">1 kg</option>
                    <option value="2">2 kg</option>
                </select>
                
                <div id="modal-action-container">
                    <!-- Dynamic Add Button / Qty Controls inject here -->
                </div>
            </div>
        </div>
    </div>

    <!-- Checkout Details Modal -->
    <div class="modal-overlay" id="checkout-modal">
        <div class="modal-content">
            <h3>Delivery Details</h3>
            <div class="input-group">
                <input type="text" id="cust-name" placeholder="Your Name" required>
            </div>
            <div class="input-group">
                <input type="tel" id="cust-phone" placeholder="Phone / WhatsApp Number" required>
            </div>
            <label class="radio-group">
                <input type="checkbox" id="is-wizzmoni" onchange="togglePlaceInput()">
                <span>I am from Wizzmoni</span>
            </label>
            <div class="input-group" id="place-container">
                <input type="text" id="cust-place" placeholder="Your Location / Place" required>
            </div>
            <div class="modal-actions">
                <button class="cancel-btn" onclick="closeCheckoutModal()">Cancel</button>
                <button class="confirm-btn" onclick="submitOrder()">Send Order</button>
            </div>
        </div>
    </div>

    <script>
        // --- 1. CONFIGURATION ---
        const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQkdpMJkEjlGqWVQmKUy9GZk_tabKkAxxgDrW5SGpe2r3vL-uoWOInuvhomxTdsrihJEhqfKvAQHFAK/pub?output=csv'; 
        const WHATSAPP_NUMBER = '918590360735'; 

        // --- 2. APP LOGIC ---
        let cart = [];
        let globalProducts = []; 
        let currentModalProductIndex = null;

        Papa.parse(SHEET_CSV_URL, {
            download: true,
            header: true,
            complete: function(results) {
                globalProducts = results.data.filter(p => p.name); 
                displayProducts();
            }
        });

        function switchTab(tabId) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById(tabId + '-tab').classList.add('active');
            
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('nav-' + tabId).classList.add('active');
            window.scrollTo(0, 0); 
        }

        function displayProducts() {
            const productList = document.getElementById('product-list');
            productList.innerHTML = ''; 

            globalProducts.forEach((product, index) => {
                const card = document.createElement('div');
                card.className = 'product-card';
                card.onclick = () => openProductModal(index);
                
                card.innerHTML = `
                    <div class="image-container">
                        <img src="${product.image}" alt="${product.name}">
                        <div id="action-${index}" class="action-container" onclick="event.stopPropagation()"></div>
                    </div>
                    <h3 class="product-title">${product.name}</h3>
                    <p class="product-desc">${product.description}</p>
                    
                    <div class="bottom-card-row" onclick="event.stopPropagation()">
                        <select id="weight-${index}" class="weight-select" onchange="updateCardActionUI(${index})">
                            <option value="" disabled selected>- size -</option>
                            <option value="0.25">250 g</option>
                            <option value="0.5">500 g</option>
                            <option value="1">1 kg</option>
                            <option value="2">2 kg</option>
                        </select>
                        <div class="price" id="price-${index}">₹${product.price}/kg</div>
                    </div>
                `;
                productList.appendChild(card);
                updateCardActionUI(index); 
            });
        }

        function promptSelection(index) {
            alert("Please choose a size first!");
            document.getElementById(`weight-${index}`).focus();
        }

        function updateCardActionUI(index) {
            const select = document.getElementById(`weight-${index}`);
            const actionContainer = document.getElementById(`action-${index}`);
            const priceContainer = document.getElementById(`price-${index}`);
            const product = globalProducts[index];
            
            if (select.value === "") {
                priceContainer.innerText = `₹${product.price}/kg`; 
                actionContainer.innerHTML = `<button class="add-plus-btn" onclick="event.stopPropagation(); promptSelection(${index})">+</button>`;
                return; 
            }

            const weightLabel = select.options[select.selectedIndex].text;
            const weightMultiplier = parseFloat(select.value);
            const currentPrice = Math.round(parseFloat(product.price) * weightMultiplier);
            
            priceContainer.innerText = `₹${currentPrice}`;
            const cartItem = cart.find(i => i.name === product.name && i.weightLabel === weightLabel);

            if (cartItem) {
                actionContainer.innerHTML = `
                    <div class="tiny-qty" onclick="event.stopPropagation()">
                        <button onclick="updateQtyFromCard(${index}, -1)">-</button>
                        <span>${cartItem.qty}</span>
                        <button onclick="updateQtyFromCard(${index}, 1)">+</button>
                    </div>
                `;
            } else {
                actionContainer.innerHTML = `<button class="add-plus-btn" onclick="event.stopPropagation(); addToCart(${index}, ${currentPrice})">+</button>`;
            }
        }

        function openProductModal(index) {
            currentModalProductIndex = index;
            const product = globalProducts[index];
            
            document.getElementById('modal-img').src = product.image;
            document.getElementById('modal-title').innerText = product.name;
            document.getElementById('modal-desc').innerText = product.description;
            
            const cardSelect = document.getElementById(`weight-${index}`);
            document.getElementById('modal-weight').value = cardSelect.value;
            
            updateModalUI();
            document.getElementById('product-modal-overlay').style.display = 'flex';
            document.body.style.overflow = 'hidden'; 
        }

        function closeProductModal() {
            document.getElementById('product-modal-overlay').style.display = 'none';
            document.body.style.overflow = ''; 
        }

        function closeProductModalOutside(event) {
            if (event.target.id === 'product-modal-overlay') {
                closeProductModal();
            }
        }

        function updateModalUI() {
            const index = currentModalProductIndex;
            const product = globalProducts[index];
            const select = document.getElementById('modal-weight');
            const priceContainer = document.getElementById('modal-price');
            const actionContainer = document.getElementById('modal-action-container');
            
            document.getElementById(`weight-${index}`).value = select.value;
            
            if (select.value === "") {
                priceContainer.innerText = `₹${product.price} / kg`;
                actionContainer.innerHTML = `<button class="big-add-btn" onclick="alert('Please choose a size first!')">Add Item</button>`;
                updateCardActionUI(index); 
                return;
            }

            const weightLabel = select.options[select.selectedIndex].text;
            const weightMultiplier = parseFloat(select.value);
            const currentPrice = Math.round(parseFloat(product.price) * weightMultiplier);
            
            priceContainer.innerText = `₹${currentPrice}`;
            
            const cartItem = cart.find(i => i.name === product.name && i.weightLabel === weightLabel);
            
            if (cartItem) {
                actionContainer.innerHTML = `
                    <div class="modal-qty-controls">
                        <button onclick="changeCartQty('${product.name}', '${weightLabel}', -1); updateModalUI();">-</button>
                        <span>${cartItem.qty} in cart</span>
                        <button onclick="changeCartQty('${product.name}', '${weightLabel}', 1); updateModalUI();">+</button>
                    </div>
                `;
            } else {
                actionContainer.innerHTML = `<button class="big-add-btn" onclick="addToCart(${index}, ${currentPrice}); updateModalUI();">Add to Cart</button>`;
            }
            
            updateCardActionUI(index);
        }

        function addToCart(index, calculatedPrice) {
            const select = document.getElementById(`weight-${index}`);
            const weightLabel = select.options[select.selectedIndex].text;
            const product = globalProducts[index];
            cart.push({ name: product.name, weightLabel: weightLabel, price: calculatedPrice, qty: 1 });
            updateCartUI();
        }

        function updateQtyFromCard(index, change) {
            const select = document.getElementById(`weight-${index}`);
            changeCartQty(globalProducts[index].name, select.options[select.selectedIndex].text, change);
        }

        function changeCartQty(name, weightLabel, change) {
            const itemIndex = cart.findIndex(i => i.name === name && i.weightLabel === weightLabel);
            if (itemIndex > -1) {
                cart[itemIndex].qty += change;
                if (cart[itemIndex].qty <= 0) cart.splice(itemIndex, 1); 
            }
            updateCartUI();
        }

        function updateCartUI() {
            const cartItemsContainer = document.getElementById('cart-items');
            const cartTotal = document.getElementById('cart-total');
            cartItemsContainer.innerHTML = '';
            let totalMoney = 0; let totalItems = 0;

            if (cart.length === 0) {
                cartItemsContainer.innerHTML = '<p style="color: #777;">Your cart is empty.</p>';
            } else {
                cart.forEach(item => {
                    totalMoney += item.price * item.qty;
                    totalItems += item.qty;
                    cartItemsContainer.innerHTML += `
                        <div class="cart-item">
                            <div class="cart-item-details">
                                <strong style="font-size: 1.1em;">${item.name}</strong>
                                <small>${item.weightLabel} - ₹${item.price}</small>
                            </div>
                            <div class="cart-qty">
                                <button onclick="changeCartQty('${item.name}', '${item.weightLabel}', -1)">-</button>
                                <span>${item.qty}</span>
                                <button onclick="changeCartQty('${item.name}', '${item.weightLabel}', 1)">+</button>
                            </div>
                        </div>
                    `;
                });
            }

            cartTotal.innerText = totalMoney;
            const floatingBtn = document.getElementById('floating-cart');
            const floatingBadge = document.getElementById('floating-badge');
            const navBadge = document.getElementById('nav-cart-badge');

            if (totalItems > 0) {
                floatingBtn.style.display = 'flex';
                floatingBadge.innerText = totalItems;
                navBadge.style.display = 'inline-block';
                navBadge.innerText = totalItems;
            } else {
                floatingBtn.style.display = 'none';
                navBadge.style.display = 'none';
            }

            globalProducts.forEach((_, index) => {
                if (document.getElementById(`weight-${index}`)) updateCardActionUI(index);
            });
            
            if (currentModalProductIndex !== null && document.getElementById('product-modal-overlay').style.display === 'flex') {
                updateModalUI();
            }
        }

        function openCheckoutModal() {
            if (cart.length === 0) { alert("Please add items to your cart first!"); switchTab('products'); return; }
            document.getElementById('checkout-modal').style.display = 'flex';
        }

        function closeCheckoutModal() {
            document.getElementById('checkout-modal').style.display = 'none';
        }

        function togglePlaceInput() {
            const isWizzmoni = document.getElementById('is-wizzmoni').checked;
            const placeContainer = document.getElementById('place-container');
            const placeInput = document.getElementById('cust-place');
            if (isWizzmoni) {
                placeContainer.style.display = 'none';
                placeInput.value = 'Wizzmoni, deliver via Rethish'; 
            } else {
                placeContainer.style.display = 'block';
                placeInput.value = ''; 
            }
        }

        function submitOrder() {
            const name = document.getElementById('cust-name').value.trim();
            const phone = document.getElementById('cust-phone').value.trim();
            const place = document.getElementById('cust-place').value.trim();

            if (!name || !phone || !place) { alert("Please fill in all details before sending the order."); return; }

            const cleanPhone = phone.replace(/[\s\-\+]/g, ''); 
            const phoneRegex = /^(?:91|0)?[6-9]\d{9}$/; 
            if (!phoneRegex.test(cleanPhone)) { alert("Please enter a valid 10-digit mobile number."); document.getElementById('cust-phone').focus(); return; }

            let message = `Hello *Sasreya Foods*! 👋\nI would like to place an order. Here are my details:\n\n`;
            message += `👤 *Name:* ${name}\n📞 *Phone:* ${phone}\n📍 *Place:* ${place}\n-------------------------------------\n*My Order Items:*\n`;
            
            let total = 0;
            cart.forEach(item => {
                message += `▪ ${item.qty} x ${item.name} [Size: ${item.weightLabel}] = ₹${item.price * item.qty}\n`;
                total += item.price * item.qty;
            });

            message += `\n*Total Amount: ₹${total}*\n`;
            const currentYear = new Date().getFullYear();
            message += `\n*© ${currentYear} sasreya.netlify.app*\n`;

            const FORM_URL = 'https://docs.google.com/forms/d/e/1FAIpQLSfC6pjkbK86p4Yen5-X5t8Aga7N0DmUxoCJSpkbxgM1qeAFuQ/formResponse';
            const ENTRY_ID = 'entry.1325426780';

            const formData = new URLSearchParams();
            formData.append(ENTRY_ID, message);

            fetch(FORM_URL, {
                method: 'POST', mode: 'no-cors', 
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: formData.toString()
            }).then(() => console.log("Order saved.")).catch((e) => console.error(e));

            const whatsappUrl = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(message)}`;
            window.open(whatsappUrl, '_blank');

            cart = [];
            document.getElementById('cust-name').value = '';
            document.getElementById('cust-phone').value = '';
            document.getElementById('cust-place').value = '';
            document.getElementById('is-wizzmoni').checked = false;
            togglePlaceInput(); 
            
            closeCheckoutModal();
            updateCartUI();
            switchTab('products');
        }
    </script>
</body>
</html>
